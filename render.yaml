databases:
  - name: peblo-db
    databaseName: peblo_tv_mini
    user: peblo
    plan: free
    region: oregon

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: peblo-api
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render free tier uses port 10000 by default; we override our app's port too
    envVars:
      - key: API_PORT
        value: 10000
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: peblo-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_ROOT
        value: /data/storage
      - key: EDITOR_API_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://peblo-cms.onrender.com,https://peblo-viewer.onrender.com"
    disk:
      name: peblo-storage
      mountPath: /data/storage
      sizeGB: 1

  # ── CMS (React / Vite — Static Site) ────────────────────────────────────────
  - type: web
    name: peblo-cms
    region: oregon
    plan: free
    runtime: static
    rootDir: cms
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://peblo-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Viewer (React / Vite — Static Site) ─────────────────────────────────────
  - type: web
    name: peblo-viewer
    region: oregon
    plan: free
    runtime: static
    rootDir: viewer
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://peblo-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
